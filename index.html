<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Планер личного развития</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <h1 class="logo">Настя Маринина</h1>
      <span class="subtitle">Коммуникационный дизайнер</span>
    </div>
    <div class="progress-block">
      <div class="progress-label">Прогресс к цели</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-percent" id="progressPercent">0%</div>
      <div class="progress-goal">Inhouse в крупный бренд → Арт-дир</div>
    </div>
  </header>

  <!-- NAV -->
  <nav class="nav">
    <button class="nav-btn" id="prevWeek">← Пред. неделя</button>
    <div class="nav-center">
      <span class="week-label" id="weekLabel"></span>
      <span class="phase-badge" id="phaseBadge"></span>
    </div>
    <button class="nav-btn" id="nextWeek">След. неделя →</button>
  </nav>

  <!-- WEEK GRID -->
  <main class="main">
    <div class="week-grid" id="weekGrid"></div>
  </main>

  <!-- MODAL: add task / reschedule -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">×</button>
      <h2 class="modal-title" id="modalTitle">Добавить задачу</h2>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- MODAL: reschedule -->
  <div class="modal-overlay" id="rescheduleOverlay">
    <div class="modal">
      <button class="modal-close" id="rescheduleClose">×</button>
      <h2 class="modal-title">Перенести задачу</h2>
      <div class="modal-body" id="rescheduleBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
